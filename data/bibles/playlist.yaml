# 채널 바이블 — 플레이리스트 트랙 (잠금 자산, 변경은 3인 합의 후에만)
# 60분 롱폼. 내레이션은 큐레이션 노트 인트로 정도로 최소 사용.
# 규칙 5-5: 곡은 라이선스 메타 확인된 것만 library.py에 등록 — 메타 없으면 ingest 거부.
channel: playlist
voice_id: TODO_ELEVENLABS_VOICE_ID
voice_params:
  stability: 0.70   # 차분한 큐레이션 톤
  similarity: 0.85
  speed: 0.95
style_anchors:
  - data/assets/playlist/anchor_01_loop_art_rainwindow.png
  - data/assets/playlist/anchor_02_loop_art_cafe.png
subtitle_tokens:
  font: "Noto Serif KR"
  size: "48"
  color: "#EDEDED"
  stroke: "#00000000"
  position: "lower-third"
lut: data/assets/playlist/lut_muted_film.cube
bgm_set: []   # 이 트랙은 곡 자체가 본편 — 별도 언더베드 BGM 없음 (규칙 5-1 예외 아님: 글로벌 트랙이 비어 있을 뿐)
character_refs: []
glossary:
  타임스탬프: "타임스탬프 (곡별 챕터, assemble이 자동 생성)"
banned_phrases:
  - "무료 다운로드"   # 저작권 오해 소지 표현 금지
  - "음원 추출"
