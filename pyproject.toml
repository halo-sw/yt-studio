[project]
name = "yt-studio-multi"
version = "1.0.0"
description = "멀티 트랙 유튜브 자동화 스튜디오 — 5트랙+숏폼 선봉, 대본→TTS→렌더→쇼츠 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "elevenlabs>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "pillow>=10.0",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
