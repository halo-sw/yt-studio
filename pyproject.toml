[project]
name = "channel-factory"
version = "0.1.0"
description = "3인 공동 운영 유튜브 자동화 스튜디오 — 카테고리 에이전트 5트랙 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "elevenlabs>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "pillow>=10.0",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
